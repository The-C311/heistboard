<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heistboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Heistboard</h1>
        <p>Every great heist starts with a plan.</p>
    </header>

    <main>
        <section aria-labelledby="briefing-heading">
            <h2 id="briefing-heading">Mission Briefing</h2>

             <form id="mission-form">
                <label for="mission-name">Mission Name</label>
                <input type="text" id="mission-name" name="mission-name" maxlength="60" required>

                <label for="mission-description">Mission Description</label>
                <textarea id="mission-description" name="mission-description" maxlength="300" required></textarea>

                <button type="submit">Create Mission</button>
                <p id="mission-error" role="alert"></p>
             </form>
        </section>
        <section aria-labelledby="current-mission-heading" aria-live="polite">
            <h2 id="current-mission-heading">Current Mission</h2>
            <h3 id="current-mission-name">No mission yet</h3>
            <p id="current-mission-description">Complete the briefing form to get started.</p>
        </section>
        <section aria-labelledby="objectives-heading">
            <h2 id="objectives-heading">Mission Objectives</h2>
            <form id="objective-form">
                <label for="objective-text">Objective</label>
                <input type="text" id="objective-text" name="objective-text" required>
                <button type="submit">Add Objective</button>
                <p id="objective-error" role="alert"></p>
            </form>
            <p id="objectives-empty">No objectives yet. Add your first objective above.</p>
            <ul id="objective-list"></ul>
        </section>
    </main>
</body>
</html>
